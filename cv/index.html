        <h1>Ronald Herrera</h1>
        <p>Construyo productos completos, del diseño a producción. Desarrollador full-stack de producto.</p>
        <h2>Proyectos</h2>
        <ul><li><strong>Fycheo</strong>: SaaS de control horario: 7 aplicaciones sobre una base de datos Supabase (empleado, panel, quiosco, web y apps móviles), con fichaje geolocalizado, turnos, chat en tiempo real y pagos con Stripe.</li><li><strong>Tankily</strong>: Red social para acuaristas en 8 idiomas, con usuarios reales: diario de cada tanque, motor de compatibilidad entre especies, foro, mercado y WikiTank con 1.847 fichas. Despliegue que no publica si fallan los tests.</li><li><strong>Protop</strong>: Directorio de 1.219 profesionales de reformas de toda España, con solicitudes de presupuesto y valoraciones respaldadas por factura. Las reglas de acceso viven en la base de datos (RLS).</li></ul>
        <h2>Ronald Lab</h2>
        <ul><li><strong>eSolar Cantabria</strong>: Web para una red de instaladores: una página por cada uno de los 102 municipios con datos de PVGIS, 6 calculadoras y 25 artículos con fuentes oficiales.</li><li><strong>Pathrix</strong>: Juego de estrategia por turnos para iOS y Android, con motor de reglas propio, IA con MCTS en 4 niveles y partidas online.</li><li><strong>Lámpara Aquarium LED</strong>: Lámpara inteligente personalizada, desde el modelado 3D hasta el control por app.</li><li><strong>Protecciones Eléctricas</strong>: Aplicación interactiva para la formación interna sobre protecciones y cuadros eléctricos.</li><li><strong>IMAGYM</strong>: Rediseño de la app de una cadena de gimnasios: research real, tree testing, sistema de diseño y prototipo.</li></ul>
        <h2>Sobre mí</h2>
        <p>Llevo productos completos a producción: base de datos, seguridad, interfaz, app móvil y despliegue. Vengo de diez años de diseño UX/UI, así que pienso en el usuario y en el negocio, no solo en el código. Busco un puesto en remoto en un equipo de producto.</p>
