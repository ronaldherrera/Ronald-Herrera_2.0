        <h1>Ronald Herrera</h1>
        <p>Ideas que terminan convertidas en cosas que funcionan. Diseño de producto digital, UX/UI y Front-end.</p>
        <h2>Proyectos</h2>
        <ul><li><strong>WALKITON</strong>: Sistema físico y digital para controlar la entrega, devolución y disponibilidad de walkie-talkies mediante pantalla táctil, NFC y ESP32.</li><li><strong>Control de rupturas</strong>: Herramienta para digitalizar el control de stock, ventas, recepciones y AVS, con validaciones, persistencia e informes en PDF.</li><li><strong>Fycheo</strong>: Plataforma SaaS para gestionar equipos, fichajes, turnos, permisos, alertas, informes y documentación.</li></ul>
        <h2>Ronald Lab</h2>
        <ul><li><strong>Lámpara Aquarium LED</strong>: Lámpara inteligente personalizada, desde el modelado 3D hasta el control por app.</li><li><strong>Protecciones Eléctricas</strong>: Aplicación interactiva para la formación interna sobre protecciones y cuadros eléctricos.</li><li><strong>SnapStore</strong>: Descargador inteligente de activos visuales para e-commerce con monitor de progreso en tiempo real.</li><li><strong>Tankily</strong>: Plataforma social para amantes de la acuariofilia: gestión de acuarios y comunidad activa.</li><li><strong>IMAGYM</strong>: Rediseño de la app de una cadena de gimnasios: research real, tree testing, sistema de diseño y prototipo.</li></ul>
        <h2>Sobre mí</h2>
        <p>Combino diseño UX/UI, desarrollo front-end y pensamiento de producto para detectar problemas reales, simplificar procesos y construir herramientas claras, útiles y eficientes.</p>
