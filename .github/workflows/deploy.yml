name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build

      # SDK oficial de Anthropic para el chat con la versión IA (PHP 8.1, como el Hostinger).
      # Va a _lib/vendor, que el .htaccess de _lib protege: PHP lo usa, pero no se abre desde el navegador.
      - name: Dependencias PHP del chat
        run: |
          composer install --no-dev --no-interaction --prefer-dist --working-dir=servidor
          cp -r servidor/vendor dist/_lib/vendor

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
